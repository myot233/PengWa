name: Compose Previews

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-previews-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out preview source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Check image publisher
        run: node --test scripts/test-publish-previews.mjs
      - name: Check gallery generator
        run: python3 -m unittest discover -s scripts -p test_preview_gallery.py
      - name: Render previews and build gallery
        run: bash scripts/render-previews.sh
      - name: Upload PNG and HTML gallery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-previews
          path: app/build/preview-gallery/
          if-no-files-found: error
          retention-days: 30
