name: Compose Preview Comment

on:
  workflow_run:
    workflows: [Compose Previews]
    types: [completed]

permissions: {}

concurrency:
  group: compose-preview-image-publication
  queue: max
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # workflow_run executes trusted default-branch code, never scripts from the PR artifact.
      - name: Check out trusted publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Publish preview image appendix
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const moduleUrl = pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/publish-previews.mjs'));
            const { publishWorkflowRun } = await import(moduleUrl.href);
            const result = await publishWorkflowRun({ github, context });
            core.info(JSON.stringify(result));
